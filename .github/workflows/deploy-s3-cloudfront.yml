name: Deploy S3 + CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-s3-cloudfront-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'sa-east-1' }}
  S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "${AWS_REGION}" || { echo "Missing AWS_REGION repository secret or variable"; exit 1; }
          test -n "${S3_BUCKET}" || { echo "Missing S3_BUCKET repository secret or variable"; exit 1; }
          test -n "${CLOUDFRONT_DISTRIBUTION_ID}" || { echo "Missing CLOUDFRONT_DISTRIBUTION_ID repository secret or variable"; exit 1; }
          test -n "${AWS_ROLE_TO_ASSUME}" || { echo "Missing AWS_ROLE_TO_ASSUME repository secret"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Upload hashed assets to S3
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html to S3
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
